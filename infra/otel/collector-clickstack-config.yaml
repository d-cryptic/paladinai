receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 512
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  clickhouse/clickstack:
    endpoint: tcp://clickstack:9000?dial_timeout=10s
    database: default
    username: ${env:CLICKSTACK_CLICKHOUSE_USER}
    password: ${env:CLICKSTACK_CLICKHOUSE_PASSWORD}
    create_schema: false
    timeout: 5s
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: paladin
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse/clickstack, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse/clickstack, debug]
