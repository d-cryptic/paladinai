global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics

  - job_name: paladin-ingest
    static_configs:
      - targets: ["host.docker.internal:9001"]
    metrics_path: /metrics

  - job_name: paladin-edge
    static_configs:
      - targets: ["host.docker.internal:9002"]
    metrics_path: /metrics

  - job_name: paladin-agent
    static_configs:
      - targets: ["host.docker.internal:9003"]
    metrics_path: /metrics

  - job_name: paladin-hub
    static_configs:
      - targets: ["host.docker.internal:9004"]
    metrics_path: /metrics
