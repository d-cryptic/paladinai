# PaladinAI v2 — local infrastructure stack
# Run: make up
# Stop: make down

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  paladin:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  qdrant_data:
  nats_data:
  falkordb_data:
  vault_data:
  hatchet_certs:
  hatchet_rabbitmq_data:

services:
  # ─────────────────────────────────────────────────────
  # NATS JetStream 2.10.x — async messaging backbone
  # ─────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: paladin-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--store_dir=/data"
      - "--cluster_name=paladin"
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # PostgreSQL 17 — primary store + Hatchet backend
  # ─────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: paladin-postgres
    environment:
      POSTGRES_USER: paladin
      POSTGRES_PASSWORD: paladin
      POSTGRES_DB: paladin
      # Hatchet needs its own DB
      POSTGRES_MULTIPLE_DATABASES: "paladin,hatchet"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - paladin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    command:
      - "-path=/migrations"
      - "-database=postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paladin
    restart: "no"

  # ─────────────────────────────────────────────────────
  # Redis Stack — Redis-compatible L1/L2/L3 cache with Search for L2 vectors
  # ─────────────────────────────────────────────────────
  valkey:
    image: redis/redis-stack-server:7.2.0-v19
    container_name: paladin-valkey
    command:
      - "redis-stack-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - "60 1"
      - "--appendonly"
      - "no"
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # Qdrant 1.16 — vector store (embeddings + tool index)
  # ─────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: paladin-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - paladin
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 15
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # FalkorDB 4.x — service dependency graph (Redis module)
  # ─────────────────────────────────────────────────────
  falkordb:
    image: falkordb/falkordb:v4.4.1
    container_name: paladin-falkordb
    ports:
      - "6380:6379"   # offset to avoid conflict with Valkey
    volumes:
      - falkordb_data:/data
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # HashiCorp Vault — secrets + integration credentials
  # Dev mode: no persistence, token = dev-root-token
  # ─────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.18
    container_name: paladin-vault
    command: server -dev -dev-root-token-id=dev-root-token
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # Hatchet — durable workflow engine (P1/P2 incidents)
  # ─────────────────────────────────────────────────────
  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.60.0
    container_name: paladin-hatchet-engine
    command: /hatchet/hatchet-engine --config /hatchet/config
    environment:
      DATABASE_URL: "postgresql://paladin:paladin@postgres:5432/hatchet?sslmode=disable"
      SERVER_GRPC_PORT: "7777"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet-engine:7777"
      SERVER_GRPC_INSECURE: "true"
      SERVER_AUTH_COOKIE_SECRETS: "devSecret1 devSecret2"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_ENCRYPTION_MASTER_KEYS: "devEncKey1"
      SERVER_ENCRYPTION_JWT_PUBLIC_KEY_PATH: /hatchet/config/auth/rsa_public.pem
      SERVER_ENCRYPTION_JWT_PRIVATE_KEY_PATH: /hatchet/config/auth/rsa_private.pem
      SERVER_TASKQUEUE_RABBITMQ_URL: "amqp://hatchet:hatchet@hatchet-rabbitmq:5672/"
      SERVER_URL: "http://localhost:8888"
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-rabbitmq:
        condition: service_healthy
    networks:
      - paladin
    volumes:
      - hatchet_certs:/hatchet/config
    logging: *default-logging
    restart: unless-stopped

  hatchet-api:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-api:v0.60.0
    container_name: paladin-hatchet-api
    command: /hatchet/hatchet-api --config /hatchet/config
    environment:
      DATABASE_URL: "postgresql://paladin:paladin@postgres:5432/hatchet?sslmode=disable"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet-engine:7777"
      SERVER_GRPC_INSECURE: "true"
      SERVER_AUTH_COOKIE_SECRETS: "devSecret1 devSecret2"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_ENCRYPTION_MASTER_KEYS: "devEncKey1"
      SERVER_ENCRYPTION_JWT_PUBLIC_KEY_PATH: /hatchet/config/auth/rsa_public.pem
      SERVER_ENCRYPTION_JWT_PRIVATE_KEY_PATH: /hatchet/config/auth/rsa_private.pem
      SERVER_TASKQUEUE_RABBITMQ_URL: "amqp://hatchet:hatchet@hatchet-rabbitmq:5672/"
      SERVER_URL: "http://localhost:8888"
    ports:
      - "8888:8080"
    depends_on:
      hatchet-engine:
        condition: service_started
    networks:
      - paladin
    volumes:
      - hatchet_certs:/hatchet/config
    logging: *default-logging
    restart: unless-stopped

  hatchet-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: paladin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hatchet
      RABBITMQ_DEFAULT_PASS: hatchet
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - hatchet_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # OTel Collector — telemetry aggregation
  # ─────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: paladin-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics export
    networks:
      - paladin
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # Prometheus — metrics scraping
  # ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: paladin-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - paladin
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # Grafana — dashboards
  # ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: paladin-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - paladin
    logging: *default-logging
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # Mock OpenRouter gateway (used when OPENROUTER_API_KEY absent)
  # Allows dev/CI without real API calls
  # ─────────────────────────────────────────────────────
  mock-llm:
    image: mockserver/mockserver:5.15.0
    container_name: paladin-mock-llm
    ports:
      - "1080:1080"
    volumes:
      - ./infra/mockserver:/config:ro
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/llm-expectations.json
      MOCKSERVER_LOG_LEVEL: WARN
    networks:
      - paladin
    logging: *default-logging

  # ─────────────────────────────────────────────────────
  # OPA sidecar — RBAC + tenant boundary enforcement
  # Policy: infra/opa/authz.rego (paladin.authz)
  # ─────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: paladin-opa
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-format=json"
      - "/policies/authz.rego"
    ports:
      - "8181:8181"
    volumes:
      - ./infra/opa:/policies:ro
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "/opa", "eval", "-d", "/policies/authz.rego", "1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ═════════════════════════════════════════════════════════════════════════
  # PaladinAI Go services (Stage 8)
  # Each service builds from its own Dockerfile and joins the `paladin`
  # network so it can reach infra by container hostname.
  # ═════════════════════════════════════════════════════════════════════════

  paladin-edge:
    build:
      context: .
      dockerfile: services/paladin-edge/Dockerfile
    image: ghcr.io/paladinai/edge:dev
    container_name: paladin-edge
    ports:
      - "9002:9002"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      JWT_SECRET: ${JWT_SECRET:-paladin-dev-jwt-secret-min-32-chars!!}
      OPA_URL: http://opa:8181
      AUTH_URL: http://paladin-auth:9003
      INGEST_URL: http://paladin-ingest:9001
      HUB_URL: http://paladin-hub:8082
      AGENT_URL: http://paladin-agent:9006
      PALADIN_EDGE_PORT: "9002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  paladin-ingest:
    build:
      context: .
      dockerfile: services/paladin-ingest/Dockerfile
    image: ghcr.io/paladinai/ingest:dev
    container_name: paladin-ingest
    ports:
      - "9001:9001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_INGEST_PORT: "9001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  paladin-auth:
    build:
      context: .
      dockerfile: services/paladin-auth/Dockerfile
    image: ghcr.io/paladinai/auth:dev
    container_name: paladin-auth
    ports:
      - "9003:9003"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: ${JWT_SECRET:-paladin-dev-jwt-secret-min-32-chars!!}
      ADMIN_SECRET: ${ADMIN_SECRET:-paladin-admin-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_AUTH_PORT: "9003"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  paladin-hub:
    build:
      context: .
      dockerfile: services/paladin-hub/Dockerfile
    image: ghcr.io/paladinai/hub:dev
    container_name: paladin-hub
    ports:
      - "8082:8082"
    volumes:
      - ./test/fixtures/runbooks:/fixtures/runbooks:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      VALKEY_URL: redis://valkey:6379
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_HUB_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  paladin-ws:
    build:
      context: .
      dockerfile: services/paladin-ws/Dockerfile
    image: ghcr.io/paladinai/ws:dev
    container_name: paladin-ws
    ports:
      - "9007:9007"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: ${JWT_SECRET:-paladin-dev-jwt-secret-min-32-chars!!}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_WS_PORT: "9007"
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9007/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  paladin-orchestrator:
    build:
      context: .
      dockerfile: services/paladin-orchestrator/Dockerfile
    image: ghcr.io/paladinai/orchestrator:dev
    container_name: paladin-orchestrator
    ports:
      - "9008:9008"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_ORCHESTRATOR_PORT: "9008"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9008/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - paladin
    restart: unless-stopped
    logging: *default-logging

  paladin-agent:
    build:
      context: .
      dockerfile: services/paladin-agent/Dockerfile
    image: ghcr.io/paladinai/agent:dev
    container_name: paladin-agent
    ports:
      - "9006:9006"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      QDRANT_URL: http://qdrant:6333
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-paladin-dev-openrouter-key}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://mock-llm:1080/api/v1}
      LLM_ALLOW_INSECURE_GATEWAY: ${LLM_ALLOW_INSECURE_GATEWAY:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_AGENT_PORT: "9006"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-llm:
        condition: service_started
    networks:
      - paladin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9006/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  paladin-comms:
    build:
      context: .
      dockerfile: services/paladin-comms/Dockerfile
    image: ghcr.io/paladinai/comms:dev
    container_name: paladin-comms
    ports:
      - "9009:9009"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      NATS_URL: nats://nats:4222
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      COMMS_MIN_SEVERITY: ${COMMS_MIN_SEVERITY:-P2}
      COMMS_WORKERS: ${COMMS_WORKERS:-4}
      COMMS_CONSUMER_NAME: paladin-comms
      PALADIN_COMMS_PORT: "9009"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - paladin
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9009/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  paladin-memory:
    build:
      context: .
      dockerfile: services/paladin-memory/Dockerfile
    image: ghcr.io/paladinai/memory:dev
    container_name: paladin-memory
    ports:
      - "9010:9010"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://paladin:${PG_PASSWORD:-paladin}@postgres:5432/paladin?sslmode=disable
      VALKEY_URL: redis://valkey:6379
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PALADIN_MEMORY_PORT: "9010"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - paladin
    restart: unless-stopped
    logging: *default-logging
