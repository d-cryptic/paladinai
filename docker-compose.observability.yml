# Optional local observability overlay.
# Run: make up-observability

services:
  otel-collector:
    command: ["--config=/etc/otel-collector-clickstack.yaml"]
    environment:
      CLICKSTACK_CLICKHOUSE_USER: ${CLICKSTACK_CLICKHOUSE_USER:-api}
      CLICKSTACK_CLICKHOUSE_PASSWORD: ${CLICKSTACK_CLICKHOUSE_PASSWORD:-api}
    volumes:
      - ./infra/otel/collector-clickstack-config.yaml:/etc/otel-collector-clickstack.yaml:ro
    depends_on:
      clickstack:
        condition: service_healthy
