name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.1"
  GOFLAGS: "-mod=mod"
  GONOSUMDB: "*"
  GOINSECURE: "*"

jobs:
  # ── lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.2
          args: --timeout=5m

  # ── vet + build ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build all binaries
        run: |
          go build -o /tmp/paladin ./cmd/paladin
          go build -o /tmp/paladin-eval ./cmd/paladin-eval
          go build -o /tmp/paladin-agent ./services/paladin-agent/cmd
          go build -o /tmp/paladin-auth ./services/paladin-auth/cmd
          go build -o /tmp/paladin-edge ./services/paladin-edge/cmd
          go build -o /tmp/paladin-hub ./services/paladin-hub/cmd
          go build -o /tmp/paladin-ingest ./services/paladin-ingest/cmd
          go build -o /tmp/paladin-memory ./services/paladin-memory/cmd
          go build -o /tmp/paladin-orchestrator ./services/paladin-orchestrator/cmd
          go build -o /tmp/paladin-ws ./services/paladin-ws/cmd
          go build -o /tmp/paladin-comms ./services/paladin-comms/cmd/main.go

      - name: Stage 7 integration catalog lint
        run: /tmp/paladin --ci integrations lint --integrations-dir integrations

      - name: Stage 11 init dry-run smoke
        env:
          PALADIN_TENANT: ci-tenant
          PALADIN_TOKEN: ci-token
        run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/readyz":
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"ok")
                      return
                  self.send_response(404)
                  self.end_headers()

              def log_message(self, *_):
                  return

          HTTPServer(("127.0.0.1", 9002), Handler).serve_forever()
          PY
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 9002 && break
            sleep 1
          done
          nc -z 127.0.0.1 9002
          /tmp/paladin --ci init --dry-run

  # ── unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests with coverage
        run: |
          go test ./... -count=1 -timeout=120s \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -5

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── eval suite ──────────────────────────────────────────────────────────────
  eval:
    name: Eval Suite
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build paladin-eval
        run: go build -o bin/paladin-eval ./cmd/paladin-eval

      - name: Run smoke eval (CI mode — no LLM)
        run: |
          ./bin/paladin-eval \
            -fixtures test/fixtures \
            -threshold 0.8

      - name: Run classification category only
        run: |
          ./bin/paladin-eval \
            -fixtures test/fixtures \
            -category classification \
            -threshold 0.8

  # ── integration tests (infra required) ──────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    services:
      valkey:
        image: redis/redis-stack-server:7.2.0-v19
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paladin
          POSTGRES_PASSWORD: paladin
          POSTGRES_DB: paladin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VALKEY_URL: localhost:6379
      NATS_URL: nats://localhost:4222
      DATABASE_URL: postgres://paladin:paladin@localhost:5432/paladin?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start NATS JetStream
        run: |
          docker run -d --name paladin-nats -p 4222:4222 nats:2.10-alpine -js
          for i in $(seq 1 15); do
            nc -z localhost 4222 && exit 0
            echo "Waiting for NATS..."
            sleep 2
          done
          docker logs paladin-nats
          exit 1

      - name: Run integration tests
        run: |
          go test -tags integration ./... -count=1 -timeout=120s

  # ── docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: |
          services=(
            paladin-agent
            paladin-auth
            paladin-comms
            paladin-edge
            paladin-hub
            paladin-ingest
            paladin-memory
            paladin-orchestrator
            paladin-ws
          )

          for service in "${services[@]}"; do
            docker buildx build \
              --cache-from "type=gha,scope=${service}" \
              --cache-to "type=gha,mode=max,scope=${service}" \
              --file "services/${service}/Dockerfile" \
              --tag "${service}:ci" \
              --load \
              .
          done
