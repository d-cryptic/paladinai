name: Playwright API Tests

on:
  push:
    branches: [v2, main]
    paths:
      - "test/e2e/**"
      - "test/playwright/**"
      - "services/**"
      - "Makefile"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.1"
  GOFLAGS: "-mod=mod"
  GONOSUMDB: "*"
  GOINSECURE: "*"

jobs:
  playwright:
    name: Playwright API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paladin
          POSTGRES_PASSWORD: paladin
          POSTGRES_DB: paladin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paladin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: redis/redis-stack-server:7.2.0-v19
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: "playwright-test-jwt-secret-min-32-chars"
      ADMIN_SECRET: "playwright-admin-secret"
      DATABASE_URL: "postgres://paladin:paladin@localhost:5432/paladin?sslmode=disable"
      NATS_URL: "nats://localhost:4222"
      VALKEY_URL: "redis://localhost:6379"
      LLM_GATEWAY_URL: "http://localhost:9099"
      PALADIN_INGEST_PORT: "9001"
      PALADIN_EDGE_PORT: "9002"
      PALADIN_AUTH_PORT: "9003"
      PALADIN_HUB_PORT: "8082"
      PALADIN_AGENT_PORT: "9006"
      PALADIN_WS_PORT: "9007"
      PALADIN_ORCHESTRATOR_PORT: "9008"
      PALADIN_COMMS_PORT: "9009"
      GRPC_ADDR: ":9010"
      MEMORY_HTTP_ADDR: ":9011"
      PALADIN_EDGE_URL: "http://localhost:9002"
      PALADIN_INGEST_URL: "http://localhost:9001"
      PALADIN_AUTH_URL: "http://localhost:9003"
      PALADIN_HUB_URL: "http://localhost:8082"
      PALADIN_AGENT_URL: "http://localhost:9006"
      PALADIN_WS_URL: "http://localhost:9007"
      PALADIN_ORCHESTRATOR_URL: "http://localhost:9008"
      PALADIN_COMMS_URL: "http://localhost:9009"
      PALADIN_MEMORY_URL: "http://localhost:9011"
      HUB_URL: "http://localhost:8082"
      INGEST_URL: "http://localhost:9001"
      AUTH_URL: "http://localhost:9003"
      AGENT_URL: "http://localhost:9006"
      RUNBOOK_FIXTURE_HOST: "127.0.0.1"
      RUNBOOK_FILE_PATH: "test/fixtures/runbooks/db-failover.md"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Start NATS JetStream
        run: |
          docker run -d --name paladin-nats -p 4222:4222 nats:2.10-alpine -js
          for i in $(seq 1 15); do
            nc -z localhost 4222 && exit 0
            echo "Waiting for NATS..."
            sleep 2
          done
          docker logs paladin-nats
          exit 1

      - name: Build all services
        run: |
          go build -o bin/paladin-ingest ./services/paladin-ingest/cmd
          go build -o bin/paladin-edge ./services/paladin-edge/cmd
          go build -o bin/paladin-auth ./services/paladin-auth/cmd
          go build -o bin/paladin-hub ./services/paladin-hub/cmd
          go build -o bin/paladin-agent ./services/paladin-agent/cmd
          go build -o bin/paladin-memory ./services/paladin-memory/cmd
          go build -o bin/paladin-ws ./services/paladin-ws/cmd
          go build -o bin/paladin-orchestrator ./services/paladin-orchestrator/cmd
          go build -o bin/paladin-comms ./services/paladin-comms/cmd/main.go

      - name: Start paladin services
        run: |
          ./bin/paladin-ingest &
          ./bin/paladin-auth &
          ./bin/paladin-hub &
          OPENROUTER_API_KEY=playwright-openrouter-key LLM_ALLOW_INSECURE_GATEWAY=true ./bin/paladin-agent &
          ./bin/paladin-memory &
          ./bin/paladin-ws &
          ./bin/paladin-orchestrator &
          ./bin/paladin-comms &
          sleep 2
          ./bin/paladin-edge &
          sleep 2

      - name: Wait for services to be ready
        run: |
          for url in \
            http://localhost:9001/readyz \
            http://localhost:9002/readyz \
            http://localhost:9003/readyz \
            http://localhost:8082/readyz \
            http://localhost:9006/readyz \
            http://localhost:9007/readyz \
            http://localhost:9008/readyz \
            http://localhost:9009/readyz \
            http://localhost:9011/readyz; do
            ready=false
            for i in $(seq 1 15); do
              if curl -sf $url; then
                ready=true
                break
              fi
              echo "Waiting for $url..."
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              echo "$url did not become ready"
              exit 1
            fi
          done

      - name: Install Playwright
        run: cd test/playwright && bun install && bunx playwright install --with-deps chromium

      - name: Run Go E2E tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: make e2e

      - name: Run Playwright API tests
        run: cd test/playwright && bun run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: test/playwright/playwright-report/
          retention-days: 14
